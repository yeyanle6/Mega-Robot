# Nav2 parameters for FASTLIO2 integration
# Key changes: Disabled AMCL, use FASTLIO2 odometry

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /lio_odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /lio_odom

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.12
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.50
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1500
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 1
      vx_max: 0.35
      vx_min: -0.05
      vy_max: 0.0
      wz_max: 0.8
      ax_max: 2.5
      ax_min: -2.5
      ay_max: 0.0
      az_max: 3.2
      vx_std: 0.18
      vy_std: 0.0
      wz_std: 0.35
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]
      ConstraintCritic.enabled: true
      ConstraintCritic.cost_power: 1
      ConstraintCritic.cost_weight: 4.0
      CostCritic.enabled: true
      CostCritic.cost_power: 1
      CostCritic.cost_weight: 4.0
      CostCritic.critical_cost: 300.0
      CostCritic.collision_cost: 1000000.0
      CostCritic.near_goal_distance: 0.6
      CostCritic.trajectory_point_step: 2
      GoalCritic.enabled: true
      GoalCritic.cost_power: 1
      GoalCritic.cost_weight: 5.0
      GoalCritic.threshold_to_consider: 1.4
      GoalAngleCritic.enabled: true
      GoalAngleCritic.cost_power: 1
      GoalAngleCritic.cost_weight: 2.5
      GoalAngleCritic.threshold_to_consider: 0.6
      PathAlignCritic.enabled: true
      PathAlignCritic.cost_power: 1
      PathAlignCritic.cost_weight: 10.0
      PathAlignCritic.threshold_to_consider: 0.8
      PathAlignCritic.max_path_occupancy_ratio: 0.07
      PathFollowCritic.enabled: true
      PathFollowCritic.cost_power: 1
      PathFollowCritic.cost_weight: 5.0
      PathFollowCritic.threshold_to_consider: 1.4
      PathAngleCritic.enabled: true
      PathAngleCritic.cost_power: 1
      PathAngleCritic.cost_weight: 2.0
      PathAngleCritic.threshold_to_consider: 0.6
      PathAngleCritic.max_angle_to_furthest: 1.0
      PreferForwardCritic.enabled: true
      PreferForwardCritic.cost_power: 1
      PreferForwardCritic.cost_weight: 5.0
      PreferForwardCritic.threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[ [0.15, 0.16], [0.15, -0.16], [-0.35, -0.16], [-0.35, 0.16] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.22
      obstacle_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 5.0             # 障碍物更快消失，降低清图等待时间
        decay_model: 0               # 0=线性衰减
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1        # 1=max
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_cloud d455_front_cloud
        lidar_cloud:
          data_type: PointCloud2
          topic: /nonground_filtered    # 经 pointcloud_relay 自身过滤后的点云
          marking: true
          clearing: true
          obstacle_range: 2.5
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "passthrough"
          clear_after_reading: true
          model_type: 1              # 3D LiDAR
          min_z: 0.1
          max_z: 2.0
          vertical_fov_angle: 0.52   # MID360 ~60° 垂直 FOV / 2
          horizontal_fov_angle: 3.14 # MID360 360° 水平 FOV / 2
          decay_acceleration: 0.0    # LiDAR 必须为 0
        d455_front_cloud:
          data_type: PointCloud2
          topic: /d455_front_obstacles    # 经近场障碍提取节点过滤后的障碍点
          marking: true
          clearing: false
          obstacle_range: 1.0            # 匹配近场滤波器的 max_range
          min_obstacle_height: 0.0       # 地面分离已由近场滤波器完成
          max_obstacle_height: 0.6
          expected_update_rate: 0.2
          observation_persistence: 0.0
          filter: "passthrough"
          clear_after_reading: true
          model_type: 0
          min_z: 0.0                     # 不再需要 costmap 侧过滤地面
          max_z: 0.6
          vertical_fov_angle: 0.52       # 放宽 FOV 以匹配 base_footprint 坐标
          horizontal_fov_angle: 1.05     # ~60° (D455 水平 FOV ≈ 87°)
          decay_acceleration: 15.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[ [0.15, 0.16], [0.15, -0.16], [-0.35, -0.16], [-0.35, 0.16] ]"
      resolution: 0.05
      track_unknown_space: false
      width: 50
      height: 50
      rolling_window: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 30.0            # global 30 秒后消失 (GitHub推荐 global: 15-45s)
        decay_model: 0               # 0=线性衰减
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1        # 1=max
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_cloud    # D455 只用于 local costmap，global 只靠 LiDAR
        lidar_cloud:
          data_type: PointCloud2
          topic: /nonground_filtered    # 经 pointcloud_relay 自身过滤后的点云
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "passthrough"
          clear_after_reading: true
          model_type: 1              # 3D LiDAR
          min_z: 0.1
          max_z: 2.0
          vertical_fov_angle: 0.52   # MID360 ~60° 垂直 FOV / 2
          horizontal_fov_angle: 3.14 # MID360 360° 水平 FOV / 2
          decay_acceleration: 0.0    # LiDAR 必须为 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.22
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                          # goal tolerance (m)
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0                   # seconds
      motion_model_for_search: "REEDS_SHEPP"   # forward + reverse
      angle_quantization_bins: 72              # 360/72 = 5° resolution
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0       # meters
      minimum_turning_radius: 0.40             # diff-drive: v/omega = 0.35/0.6 ≈ 0.58m, use 0.40m for tighter turns
      reverse_penalty: 2.5                     # prefer forward motion
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0                        # costmap cost sensitivity
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.0]
    min_velocity: [-0.35, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/lio_odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
